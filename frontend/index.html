async function req(path, opt = {}) {
  if (isDemoMode) {
    throw new Error('DEMO_MODE');
  }
  const headers = { 'Content-Type': 'application/json', ...(opt.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  try {
    const res = await fetch(API_BASE + path, { ...opt, headers });
    if (res.status === 401) { out(); throw new Error('Session expired. Please sign in again.'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Server request failed (' + res.status + ')');
    return data;
  } catch(e) {
    console.error('API Error:', path, e);
    throw e;
  }
}

function updateDemoDash() {
  const act = S.subs.filter(s=>s.status==='ACTIVE'||s.status==='Active');
  const mrr = act.reduce((a,s)=>{
    const sub = (s.lines||[]).reduce((t,l)=>t+l.quantity*l.unitPrice, 0);
    const p = s.plan?.billingPeriod || 'MONTHLY';
    const mult = p==='DAILY'?30 : p==='WEEKLY'?4.33 : p==='YEARLY'?1/12 : 1;
    return a + sub * mult;
  }, 0);
  const collected = S.pay.reduce((a,p)=>a+(+p.amount||0), 0);
  const owed = S.inv.filter(i=>i.status==='CONFIRMED'||i.status==='Confirmed').reduce((a,i)=>a+(+i.balance||0), 0);
  const overdue = S.inv.filter(i=>(i.status==='CONFIRMED'||i.status==='Confirmed') && i.dueDate < td()).length;
  S.dash = { activeSubscriptions: act.length, monthlyRecurringRevenue: mrr, revenueCollected: collected, outstandingAmount: owed, overdueInvoiceCount: overdue };
}

      req('/invoices').catch(() => []),
      req('/payments').catch(() => []),

      U.role !== 'CUSTOMER' ? req(`/dashboard?from=${F.f||''}&to=${F.t||''}`).catch(() => ({})) : Promise.resolve({})

}

const head=(t,b='')=>`<div class=hd><h2>${t}</h2><div>${b}</div></div>`;

function subAct(s){
  const p=s.plan||{}, b=[];
  if(s.status=='PAUSED'||s.status=='Paused') b.push(['Resume','RESUME']);
  else if(s.status=='DRAFT'||s.status=='Draft') b.push(['Confirm','CONFIRM']);
  else if(s.status=='CONFIRMED'||s.status=='Confirmed') b.push(['Activate','ACTIVATE']);
  else if(s.status=='ACTIVE'||s.status=='Active'){
    if(p.canClose!==false) b.push(['Close','CLOSE']);
    if(p.canPause!==false) b.push(['Pause','PAUSE']);
  }
  const r=(s.status=='ACTIVE'||s.status=='Active'||s.status=='CLOSED'||s.status=='Closed') && p.canRenew!==false ? `<button class="btn sm" onclick="doSubAct(${s.id},'RENEW')">Renew</button>` : '';
  return b.map(x=>`<button class="btn sm" onclick="doSubAct(${s.id},'${x[1]}')">${x[0]}</button>`).join('')+r;
}

async function doSubAct(id, act){
  if (isDemoMode) {
    const s = S.subs.find(x=>x.id==id);
    if (s) {
      if (act==='CONFIRM') s.status = 'CONFIRMED';
      else if (act==='ACTIVATE') { s.status = 'ACTIVE'; if (!s.nextBillDate) s.nextBillDate = td(); }
      else if (act==='PAUSE') s.status = 'PAUSED';
      else if (act==='RESUME') s.status = 'ACTIVE';
      else if (act==='CLOSE') s.status = 'CLOSED';
      else if (act==='RENEW') {
        const d = new Date(s.expiryDate); d.setFullYear(d.getFullYear()+1);
        s.expiryDate = d.toISOString().slice(0,10);
        s.status = 'ACTIVE';
      }
      saveDemo();
      toast('Subscription updated');
      rr();
    }
    return;
  }
  try {
    await req(`/subscriptions/${id}/action`, { method: 'PUT', body: JSON.stringify({ action: act }) });
    toast('Subscription updated');
    await loadData();
    rr();
  } catch(e) { toast(e.message); }
}

function invAct(i){
  const a=[];
  if(i.status=='DRAFT'||i.status=='Draft') a.push(['Confirm','CONFIRMED']);
  if(i.status=='DRAFT'||i.status=='Draft'||i.status=='CONFIRMED'||i.status=='Confirmed') a.push(['Cancel','CANCELLED']);
  if(i.status!='CANCELLED'&&i.status!='Cancelled') a.push(['Send','send']);
  if(i.status=='CONFIRMED'||i.status=='Confirmed'||i.status=='DRAFT'||i.status=='Draft') a.push(['Record payment','pay']);
  return a.map(x=>`<button class="btn sm" onclick="doInvAct(${i.id},'${x[1]}')">${x[0]}</button>`).join('')+`<button class="btn sm" onclick="viewInv(${i.id})">View / Print</button>`;
}

async function doInvAct(id, a){
  const i=S.inv.find(x=>x.id==id);
  if(a=='send'){ toast(`Invoice ${i.invoiceNo} sent to ${i.customerEmail||'customer'}`); return; }
  if(a=='pay'){ payForm(i); return; }
  if (isDemoMode) {
    if (i) { i.status = a; saveDemo(); toast(`Invoice status updated to ${a}`); rr(); }
    return;
  }
  try {
    await req(`/invoices/${id}/status`, { method: 'PUT', body: JSON.stringify({ status: a }) });
    toast(`Invoice status updated to ${a}`);
    await loadData();
    rr();
  } catch(e) { toast(e.message); }
}

function payForm(i){
  modal(`Record payment · ${i.invoiceNo}`, [
    {k:'method', l:'Method', t:'select', o:['UPI','Card','Cash','Bank Transfer','Cheque'].map(x=>[x,x])},
    {k:'amount', l:`Amount (due ${fm(i.balance)})`, t:'number', v:i.balance},
    {k:'paymentDate', l:'Date', t:'date', v:td()},
    {k:'note', l:'Note'}
  ], async (v)=>{
    if(!(v.amount>0) || v.amount > i.balance + 0.01) { toast('Enter an amount up to ' + fm(i.balance)); return false; }
    if (isDemoMode) {
      S.pay.unshift({ id: Date.now(), invoiceId: i.id, invoiceNo: i.invoiceNo, customerName: i.customerName, amount: +v.amount, method: v.method, paymentDate: v.paymentDate, note: v.note });
      i.paidAmount = (+i.paidAmount||0) + (+v.amount);
      i.balance = Math.max(0, i.total - i.paidAmount);
      if (i.balance < 0.01) i.status = 'PAID';
      else if (i.status === 'DRAFT') i.status = 'CONFIRMED';
      saveDemo();
      toast('Payment recorded successfully');
      rr();
      return;
    }
    try {
      await req('/payments', {
        method: 'POST',
        body: JSON.stringify({
          invoiceId: i.id,
          amount: v.amount,
          method: v.method.toUpperCase().replace(' ','_'),
          paymentDate: v.paymentDate,
          note: v.note
        })
      });
      toast('Payment recorded successfully');
      await loadData();
      rr();
    } catch(e) { toast(e.message); return false; }
  });
}

function payPick(){
  const unpaid = S.inv.filter(i=> (i.status=='CONFIRMED'||i.status=='Confirmed'||i.status=='DRAFT'||i.status=='Draft') && i.balance > 0);
  if(!unpaid.length){ toast('No unpaid invoices. Run billing first.'); return; }
  modal('Choose invoice', [
    {k:'id', l:'Invoice', t:'select', o: unpaid.map(i=>[i.id, `${i.invoiceNo} · ${i.customerName} · ${fm(i.balance)} (${i.status})`])}
  ], (v)=>{
    const inv = S.inv.find(x=>x.id==v.id);
    if(inv) setTimeout(()=>payForm(inv), 50);
  }, 'Next');
}

async function runBillingAction(){
  if (isDemoMode) {
    let created = 0;
    S.subs.filter(s=>s.status==='ACTIVE'||s.status==='Active').forEach(s=>{
      const key = s.id + '@' + (s.nextBillDate || td());
      if (!S.inv.some(i=>i.billingKey===key)) {
        const lines = (s.lines||[]).map(l=>({ ...l, lineTotal: l.quantity*l.unitPrice }));
        const sub = lines.reduce((a,l)=>a+l.lineTotal, 0);
        const tax = lines.reduce((a,l)=>a+l.lineTotal*(l.taxRate||18)/100, 0);
        const invNo = 'INV-' + String(S.inv.length+1).padStart(5,'0');
        S.inv.push({
          id: Date.now() + created,
          invoiceNo: invNo,
          billingKey: key,
          subscriptionId: s.id,
          customerId: s.customer?.id || 3,
          customerName: s.customer?.name || 'Customer',
          customerEmail: s.customer?.email || 'customer@acme.com',
          invoiceDate: s.nextBillDate || td(),
          dueDate: new Date(Date.now()+15*864e5).toISOString().slice(0,10),
          subtotal: sub,
          discountAmount: 0,
          taxAmount: tax,
          total: sub + tax,
          paidAmount: 0,
          balance: sub + tax,
          status: 'DRAFT',
          sent: false,
          lines
        });
        created++;
      }
    });
    saveDemo();
    toast(created ? `${created} invoice(s) generated!` : 'Nothing due — no duplicates created.');
    rr();
    return;
  }
  try {
    const res = await req('/invoices/billing/run', { method: 'POST' });
    toast(res.invoicesCreated ? `${res.invoicesCreated} invoice(s) generated!` : 'Nothing due — no duplicates created.');
    await loadData();
    rr();
  } catch(e) { toast(e.message); }
}

  const productOptions = S.prod.map(p=>[p.id, `${p.name} (₹${p.salePrice})`]);

function modal(t,fs,cb,ok='Save'){
  const m=$('#md');
  m.innerHTML=`<div class=mb><h3>${t}</h3>${fs.map(f=>`<label>${f.l}${f.t=='select'?`<select id=f_${f.k}>${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.t=='check'?`<input type=checkbox id=f_${f.k} ${f.v?'checked':''}>`:`<input id=f_${f.k} type=${f.t||'text'} value="${esc(f.v??'')}">`}</label>`).join('')}<div class=row><button class=btn onclick=cm()>Cancel</button><button class="btn pr" id=modal_ok_btn>${ok}</button></div></div>`;
  m.className='md on';
  $('#modal_ok_btn').onclick = async ()=>{
    const v={};
    fs.forEach(f=>{
      const e=$('#f_'+f.k);
      v[f.k]=f.t=='check'?e.checked:f.t=='number'?+e.value:e.value;
    });
    if(await cb(v)!==false){ cm(); }
  };
}

async function auth(){
  const e=$('#ae').value.trim().toLowerCase(), p=$('#ap').value, R=m=>$('#ar').textContent=m;
  R('');

  // If in demo mode (e.g. GitHub Pages preview without local backend)
  if (isDemoMode) {
    return authLocal(e, p, R);
  }

  try {
    if(tab=='up'){
      const n=$('#an').value.trim();
      if(!n||!/^\S+@\S+\.\S+$/.test(e)) return R('Enter your name and a valid email.');
      const res = await req('/auth/register', { method: 'POST', body: JSON.stringify({ name: n, email: e, password: p, role: 'CUSTOMER' }) });
      token = res.token;
      U = { id: res.userId, name: res.name, email: res.email, role: res.role };
    } else {
      const res = await req('/auth/login', { method: 'POST', body: JSON.stringify({ email: e, password: p }) });
      token = res.token;
      U = { id: res.userId, name: res.name, email: res.email, role: res.role };
    }
    localStorage.setItem('bl_jwt', token);
    localStorage.setItem('bl_u', JSON.stringify(U));
    page = NAV[U.role][0][0];
    await loadData();
    rr();
  } catch(err) {
    console.warn('API auth failed, attempting demo fallback:', err);

    isDemoMode = true;
    authLocal(e, p, R);
  }
}

  };

  <div class=ft><span>© Brightloop Software · Powered by Spring Boot & MySQL</span><a onclick="scrollTo({top:0,behavior:'smooth'})">Back to top</a></div></div>`;
}

function cnt(fast){
  document.querySelectorAll('[data-n]').forEach(e=>{
    const n=+e.dataset.n,d=+e.dataset.d||0,sf=e.dataset.s||'',put=v=>e.textContent=v.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d})+sf;
    if(fast)return put(n);
    let t0;const f=t=>{t0??=t;const p=Math.min(1,(t-t0)/1800);put(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};
    put(0);requestAnimationFrame(f);
  });
}

function rr(f){
  const a=$('#app');
  document.documentElement.dataset.mode=isDark()?'d':'l';
  if(L){ a.innerHTML=landH(); cnt(false); io(); return; }
  if(!U){ const first=!AP; a.innerHTML=authH(); cnt(!first); AP=true; return; }
  a.innerHTML=`${isDemoMode ? `<div class="banner"><span>☁️ <b>GitHub Pages Preview Mode</b> (Client Demo Storage)</span><span>Run locally on <a href="http://localhost:8080" target="_blank" style="color:var(--ac);font-weight:600">http://localhost:8080</a> for full Java Spring Boot + MySQL backend</span></div>` : ''}
  <div class=sh><aside><div class=lg onclick=goL() style="cursor:pointer" title="Back to home">◐ Brightloop</div>${(NAV[U.role]||[]).map(n=>`<a class="${page==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}</aside><main><div class=tb><button class="btn ic" title="Toggle dark mode" onclick=tgl()>${isDark()?'☀':'☾'}</button><div class=chip><span class=av>${esc(U.name[0]).toUpperCase()}</span>${esc(U.name)}<small style="margin-left:6px;text-transform:lowercase">${U.role}</small></div><button class=btn onclick=out()>Sign out</button></div>${P[page]?P[page]():P.dash()}</main></div>`;
  if(f){ const e=$('.sr'); if(e){ e.focus(); e.setSelectionRange(1e3,1e3); } }
}

(async()=>{
  try{ const th=localStorage.getItem('bl_theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
  try{
    const cachedU = localStorage.getItem('bl_u');
    if(cachedU) {
      U = JSON.parse(cachedU);
      page = NAV[U.role]?.[0]?.[0] || 'dash';
      L = false;
      await loadData();
    }
  }catch(e){}
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>rr());
  rr();
})();
