# ─────────────────────────────────────────────
# Brightloop Billing – application.properties
# Use environment variables in production:
#   DB_URL, DB_USER, DB_PASS, JWT_SECRET
# ─────────────────────────────────────────────

spring.application.name=brightloop-billing
server.port=8080

# ── Database ──────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/brightloop_billing?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:Himanshu@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ── JWT ───────────────────────────────────────
app.jwt.secret=${JWT_SECRET:BrightloopBillingSecretKey2026HackathonMVPDontUseInProd!}
app.jwt.expiration-ms=86400000

# ── Logging ───────────────────────────────────
logging.level.com.brightloop=INFO
